defaultTasks 'clean', 'build'

def projectVersion = file('version.txt').text.trim()

def getConfigProperty(final String propertyName) {
    String value = project.findProperty(propertyName)
    if (!value) {
        value = System.getenv(propertyName)
        if (!value) {
            return null
        }
    }
    return value.trim()
}

ext {
    sdsmSrcJavaVersion = JavaVersion.toVersion(srcJavaVersion)

    isRelease = !projectVersion.endsWith('-SNAPSHOT')

    sonatypeReleasesRepoUrl = isRelease
            ? 'https://ossrh-staging-api.central.sonatype.com/service/local/staging/deploy/maven2/'
            : 'https://central.sonatype.com/repository/maven-snapshots/'

    sonatypeUsername = getConfigProperty('SONATYPE_USERNAME')
    sonatypePassword = getConfigProperty('SONATYPE_PASSWORD')

    signingKey = getConfigProperty('SIGNING_GPG_SECRET_KEY')    // ascii-armored secret key
    signingPassword = getConfigProperty('SIGNING_GPG_PASSWORD') // plain text
}

def projectPom = {
    name = projectName
    url = 'https://github.com/green4j/sdsm'

    scm {
        connection = 'scm:git:https://github.com/green4j/sdsm.git'
        developerConnection = 'scm:git:https://github.com/green4j/sdsm.git'
        url = 'https://github.com/green4j/sdsm.git'
    }

    licenses {
        license {
            name = 'MIT License'
            url = 'https://opensource.org/licenses/MIT'
        }
    }

    developers {
        developer {
            id = 'anatolygudkov'
            name = 'Anatoly Gudkov'
            email = 'gudkovanatoly@hotmail.com'
            url = 'https://github.com/anatolygudkov'
        }
    }
}

def sdsmProject = project(':sdsm')
def exampleProject = project(':sdsm-example')
def javaProjects = [sdsmProject, exampleProject]

configure(javaProjects) {
    apply plugin: 'java-library'
    apply plugin: 'checkstyle'

    group = projectGroup
    version = projectVersion

    repositories {
        mavenLocal()
        mavenCentral()
    }

    dependencies {
        checkstyle "com.puppycrawl.tools:checkstyle:${checkstyleVersion}"
    }

    java {
        sourceCompatibility = sdsmSrcJavaVersion
        targetCompatibility = sdsmSrcJavaVersion
    }

    compileJava {
        options.compilerArgs.addAll(['-Xlint:all', '-Werror'])
        options.encoding = 'UTF-8'
        options.deprecation = true
    }

    jar {
        manifest {
            attributes 'Implementation-Title': projectName,
                    'Implementation-Version': projectVersion,
                    'Implementation-Vendor': projectAuthor
        }
        includeEmptyDirs = false
    }

    checkstyle {
        toolVersion = "${checkstyleVersion}"
    }
}

configure(javaProjects) {
    dependencies {
        testImplementation "org.junit.jupiter:junit-jupiter:${jupiterVersion}"
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    test {
        useJUnitPlatform()

        testLogging {
            events 'skipped', 'failed'
            showStandardStreams = true
            exceptionFormat = 'full'
            afterSuite { desc, result ->
                if (!desc.parent) {
                    println "Results: ${result.resultType} (${result.testCount} tests, " +
                            "${result.successfulTestCount} successes, " +
                            "${result.failedTestCount} failures, " +
                            "${result.skippedTestCount} skipped)"
                }
            }
        }
    }
}

configure(exampleProject) {
    description = 'SDSM examples - not part of the framework'

    apply plugin: 'application'

    dependencies {
        implementation sdsmProject
        implementation "io.github.green4j:newa-websocket:${newaVersion}"
        implementation "io.github.green4j:newa-rest:${newaVersion}"
    }

    application {
        mainClass = 'io.github.green4j.sdsm.example.demo.Demo'
    }

    run {
        standardInput = System.in
    }

    tasks.register('runBasic', JavaExec) {
        group = 'application'
        description = 'One step of the basic examples: -Pstep=<number>'
        classpath = sourceSets.main.runtimeClasspath
        mainClass = provider {
            def prefix = String.format('B%02d', ((project.findProperty('step') ?: '1') as String) as int)
            def found = exampleProject.file('src/main/java/io/github/green4j/sdsm/example/basic').listFiles()
                    .find { it.name.startsWith(prefix) }
            if (found == null) {
                throw new GradleException("No basic example ${prefix}")
            }
            'io.github.green4j.sdsm.example.basic.' + (found.name - '.java')
        }
    }

    tasks.register('runServer', JavaExec) {
        group = 'application'
        description = 'The same model over a websocket'
        classpath = sourceSets.main.runtimeClasspath
        mainClass = 'io.github.green4j.sdsm.example.newa.SdsmWsServer'
        standardInput = System.in
    }
}

configure(sdsmProject) {
    description = 'SDSM - dynamic structure modelling (JDK standard library)'

    apply plugin: 'maven-publish'
    apply plugin: 'signing'
    // Coverage is for the library only: the examples exist to be read and run.
    apply plugin: 'jacoco'

    check {
        dependsOn jacocoTestReport
    }

    java {
        withSourcesJar()
        withJavadocJar()
    }

    javadoc {
        failOnError = false

        title = "<h1>${projectName}</h1>"
        options.bottom = "<i>Copyright (c) 2026 ${projectAuthor} and others. All Rights Reserved.</i>"
        options.encoding = 'UTF-8'
        options.docEncoding = 'UTF-8'
        options.charSet = 'UTF-8'
        if (JavaVersion.current().isJava10Compatible()) {
            options.addBooleanOption 'html5', true
        }
        options.addStringOption('Xdoclint:all,-missing', '-quiet')
    }

    tasks.withType(Sign).configureEach {
        onlyIf {
            isRelease && gradle.taskGraph.hasTask(tasks.publish)
        }
    }

    publishing {
        publications {
            sdsm(MavenPublication) {
                from components.java
                pom(projectPom)
                pom {
                    name = sdsmProject.name
                    description = sdsmProject.description
                }
            }
        }
        repositories {
            maven {
                name = 'MavenCentral'
                url = sonatypeReleasesRepoUrl
                credentials {
                    username = sonatypeUsername
                    password = sonatypePassword
                }
            }
        }
    }

    signing {
        if (signingKey) {
            useInMemoryPgpKeys(signingKey, signingPassword)
        }
        sign publishing.publications
    }
}

tasks.register('uploadArtifactsToSonatypeCentralPortal', SonatypeCentralPortalUploadRepositoryTask) {
    portalUsername.set(sonatypeUsername)
    portalPassword.set(sonatypePassword)
    groupId.set(projectGroup)
    snapshotRelease.set(!isRelease)
}
